# Render blueprint for the API (with the worker inside it). The web app goes on Vercel and the
# database on Neon; see "Deploy" in the README.
services:
  - type: web
    name: recall-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # Next to the Neon database (us-east-2): a guest's copy takes many small queries.
    region: ohio
    healthCheckPath: /ping
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: FETCH_CONTACT
        sync: false
      - key: RUN_WORKER_IN_API
        value: "true"
      # The free plan has a tenth of a CPU: one model thread makes searches about 7x cheaper.
      - key: MODEL_THREADS
        value: "1"
      - key: FILE_STORE
        value: database
      - key: COOKIE_SECURE
        value: "true"
      # The public demo: visitors get a day-long copy of this account's library (put there
      # with `python -m demo.publish`). Remove it to turn the demo off.
      - key: GUEST_TEMPLATE_EMAIL
        value: demo@example.com
      # Gemini calls a day across everyone, under the free tier's daily limit.
      - key: DAILY_LLM_CALLS
        value: "400"
